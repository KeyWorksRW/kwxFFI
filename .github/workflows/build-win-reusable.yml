name: "Reusable Windows Build"

on:
  workflow_call:
    inputs:
      create-setup:
        description: 'Unused; kept so existing callers stay compatible'
        required: false
        type: boolean
        default: false
      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        type: string
        default: 'Release'
      build-shared:
        description: "Build kwxFFI as a shared library ('ON') or static ('OFF')"
        required: false
        type: string
        default: 'ON'

env:
  # This is a public repository, so the GitHub Actions cache backend for
  # sccache is free. Without this the sccache install below caches nothing.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  buildWindows:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup CMake 4.2+
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~4.2.0'
        ninjaVersion: 'latest'

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure CMake
      run: cmake -G "Visual Studio 18 2026" -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{inputs.build-type}} -DKWXFFI_BUILD_SHARED=${{inputs.build-shared}} -DKWXFFI_BUILD_TESTS=ON

    - name: Build kwxFFI
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --parallel 4 --target kwxFFI

    - name: Build parser tests
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --parallel 4 --target kwx_parser_tests

    - name: Run cheap tests
      run: ctest --test-dir ${{github.workspace}}/build -C ${{inputs.build-type}} -L cheap --output-on-failure

    - name: Resolve export symbols against the DLL
      if: inputs.build-shared == 'ON'
      run: python tests/checks/symbol_resolve.py --root . --library lib/${{inputs.build-type}}/kwxFFI.dll

    # The path uses inputs.build-type instead of a hardcoded Release so a Debug
    # build does not upload nothing, and if-no-files-found makes a regression in
    # KWXFFI_BUILD_SHARED fail loudly instead of producing an empty artifact.
    - name: Publish kwxFFI DLL and import libs
      uses: actions/upload-artifact@v5
      with:
        name: kwxFFI-Windows-${{inputs.build-type}}-${{inputs.build-shared == 'ON' && 'shared' || 'static'}}
        path: lib/${{inputs.build-type}}/kwxFFI.*
        if-no-files-found: error
