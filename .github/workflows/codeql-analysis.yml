name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'kwxgen/**'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: windows-2025-vs2026
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # build-mode: none is required: the project needs a full wxWidgets
    # FetchContent configure (a long, network-heavy CMake configure), and any
    # manual build mode would have to reproduce it exactly. The cost is reduced
    # analysis accuracy -- no translation units are compiled, so interprocedural
    # facts are weaker and header-only or macro-heavy code is seen less clearly.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
