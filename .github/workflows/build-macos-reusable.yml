name: "Reusable macOS Build"

on:
  workflow_call:
    inputs:
      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        type: string
        default: 'Release'
      build-both:
        description: "Build static and shared kwxFFI from one wxWidgets build ('ON') or honor build-shared"
        required: false
        type: string
        default: 'ON'
      build-shared:
        description: "Deprecated; ignored when build-both is 'ON'"
        required: false
        type: string
        default: 'ON'
      runner-type:
        description: 'Runner label (macos-15 for the universal build, or self-hosted labels)'
        required: false
        type: string
        default: 'macos-15'

jobs:
  buildMacOS:
    runs-on: ${{ inputs.runner-type }}
    env:
      SCCACHE_DIR: ${{github.workspace}}/.sccache
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Xcode
      if: ${{ !startsWith(inputs.runner-type, 'self-hosted') }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Setup CMake 4.2+ and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~4.2.0'
        ninjaVersion: 'latest'

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure CMake (universal binary)
      run: cmake -B ${{github.workspace}}/build -G "Ninja Multi-Config" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DKWXFFI_BUILD_BOTH=${{inputs.build-both}} -DKWXFFI_BUILD_SHARED=${{inputs.build-shared}} -DKWXFFI_BUILD_TESTS=ON

    - name: Build kwxFFI static library
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --target kwxFFI

    - name: Build kwxFFI shared library
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --target kwxFFI_shared

    - name: Build parser tests
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --target kwx_parser_tests

    - name: Run cheap tests
      run: ctest --test-dir ${{github.workspace}}/build -C ${{inputs.build-type}} -L cheap --output-on-failure

    - name: Run library tests
      run: ctest --test-dir ${{github.workspace}}/build -C ${{inputs.build-type}} -L library --output-on-failure

    # The dual build writes both library types to separate directories.
    # if-no-files-found makes a missing library type fail loudly instead of
    # producing an empty artifact.
    - name: Publish kwxFFI static library
      uses: actions/upload-artifact@v5
      with:
        name: kwxFFI-macOS-${{inputs.build-type}}-static
        path: lib/static/${{inputs.build-type}}/libkwxFFI.a
        if-no-files-found: error

    - name: Publish kwxFFI shared library
      uses: actions/upload-artifact@v5
      with:
        name: kwxFFI-macOS-${{inputs.build-type}}-shared
        path: lib/shared/${{inputs.build-type}}/libkwxFFI.dylib
        if-no-files-found: error
