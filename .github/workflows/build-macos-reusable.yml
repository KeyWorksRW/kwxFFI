name: "Reusable macOS Build"

on:
  workflow_call:
    inputs:
      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        type: string
        default: 'Release'
      runner-type:
        description: 'Runner label (macos-15 for the universal build, or self-hosted labels)'
        required: false
        type: string
        default: 'macos-15'

jobs:
  buildMacOS:
    runs-on: ${{ inputs.runner-type }}
    env:
      SCCACHE_DIR: ${{github.workspace}}/.sccache
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Xcode
      if: ${{ !startsWith(inputs.runner-type, 'self-hosted') }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Setup CMake 4.2+ and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~4.2.0'
        ninjaVersion: 'latest'

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure CMake (universal binary)
      run: cmake -B ${{github.workspace}}/build -G "Ninja Multi-Config" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DKWXFFI_BUILD_SHARED=ON -DKWXFFI_BUILD_TESTS=ON

    - name: Build kwxFFI
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --target kwxFFI

    - name: Build parser tests
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --target kwx_parser_tests

    - name: Run cheap tests
      run: ctest --test-dir ${{github.workspace}}/build -C ${{inputs.build-type}} -L cheap --output-on-failure

    - name: Resolve export symbols against the shared library
      run: python3 tests/checks/symbol_resolve.py --root . --library lib/${{inputs.build-type}}/libkwxFFI.dylib

    - name: Publish kwxFFI shared library
      uses: actions/upload-artifact@v5
      with:
        name: kwxFFI-macOS-${{inputs.build-type}}-universal
        path: lib/${{inputs.build-type}}/libkwxFFI.dylib
        if-no-files-found: error
