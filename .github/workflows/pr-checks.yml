name: "PR Checks"

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: "pr-checks-${{ github.ref }}"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quick:
    name: quick tests
    # Maintainer-only gate: a fork PR would otherwise execute untrusted code on
    # the self-hosted runner. Everyone else falls back to a GitHub-hosted box.
    runs-on: ${{ github.actor == 'Randalphwa' && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Select a C++23 compiler
      id: cxx
      # Enumerated rather than hard-coded: take every g++/clang++ on the box, keep
      # those meeting the minimum major version (g++ >= 14, clang++ >= 20), newest
      # first (GCC preferred over Clang), then compile a <print> probe. The probe
      # stays the deciding test because Clang only has <print> when the libstdc++
      # it finds is 14 or newer.
      run: |
        probe_dir=$(mktemp -d)
        candidates="$probe_dir/candidates"
        printf '#include <print>\nint main() { std::println("ok"); }\n' > "$probe_dir/probe.cpp"

        add_candidates() {
          local prefix=$1 min_major=$2 comp major
          for comp in /usr/bin/"$prefix" /usr/bin/"$prefix"-[0-9]*; do
            [ -x "$comp" ] || continue
            major=$("$comp" -dumpversion 2>/dev/null | grep -oE '^[0-9]+' || true)
            [ -n "$major" ] || continue
            [ "$major" -ge "$min_major" ] || continue
            printf '%s %s\n' "$major" "$comp"
          done | sort -rn -k1,1
        }
        add_candidates g++ 14 > "$candidates"
        add_candidates clang++ 20 >> "$candidates"

        while read -r major comp; do
          [ -n "$comp" ] || continue
          if "$comp" -std=c++23 "$probe_dir/probe.cpp" -o "$probe_dir/probe" 2>/dev/null; then
            echo "Using CXX=$comp (major $major)"
            echo "CXX=$comp" >> "$GITHUB_ENV"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            rm -rf "$probe_dir"
            exit 0
          fi
        done < "$candidates"

        rm -rf "$probe_dir"
        echo "needed=true" >> "$GITHUB_OUTPUT"
        echo "::notice::No C++23-capable compiler (g++ >= 14 or clang++ >= 20) found; g++-14 will be installed."

    - name: Install g++-14 (only if the runner has no newer compiler)
      # Reached on GitHub-hosted ubuntu-24.04, which ships GCC 13 only. A runner
      # with g++ >= 14 or clang++ >= 20 skips this step entirely.
      if: steps.cxx.outputs.needed == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip python3 g++-14
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Check CMake
      id: cmake
      # Use the runner's own CMake when it is already >= 4.2; only download
      # 4.2 when CMake is missing or too old.
      run: |
        if command -v cmake >/dev/null 2>&1; then
          version=$(cmake --version | head -n1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1)
        else
          version=""
        fi

        if [ -z "$version" ]; then
          echo "CMake not found -- will install 4.2"
          echo "needed=true" >> "$GITHUB_OUTPUT"
        elif [ "$(printf '4.2\n%s\n' "$version" | sort -V | head -n1)" = "4.2" ]; then
          echo "Found CMake $version (>= 4.2) -- keeping it"
          echo "needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "Found CMake $version (< 4.2) -- will install 4.2"
          echo "needed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Check Ninja
      id: ninja
      # Any Ninja version is fine -- presence is the only requirement.
      run: |
        if command -v ninja >/dev/null 2>&1; then
          echo "Found Ninja $(ninja --version) -- keeping it"
          echo "needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "Ninja not found -- will install it"
          echo "needed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup CMake 4.2 (only if missing or too old)
      if: steps.cmake.outputs.needed == 'true'
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~4.2.0'
        ninjaVersion: 'latest'

    - name: Setup Ninja (only if missing)
      if: steps.ninja.outputs.needed == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Configure tests
      # Never configure into build/tests: the root project's own build owns that
      # directory and a second tree there corrupts its Ninja dyndep files. The
      # tests project refuses to configure there and points at this directory.
      run: |
        cmake -S tests -B build/standalone-tests -G "Ninja Multi-Config" \
          -DCMAKE_CXX_COMPILER="$CXX"

    - name: Build tests
      run: cmake --build build/standalone-tests --config Release --parallel 4

    - name: Run cheap tests
      run: ctest --test-dir build/standalone-tests -C Release -L cheap --output-on-failure

  shared:
    name: shared library build
    # The `quick` job configures only tests/, so it never links kwxFFI or
    # kwxFFI_shared. This job builds both library types from one wxWidgets build
    # and runs the `library`-labeled tests, which is what catches unresolved
    # symbols in the shared library before they reach the daily build.
    # Self-hosted stays behind the maintainer-only gate: untrusted pull request
    # code must never execute on that machine. 'self-hosted' resolves inside the
    # reusable workflow to the macOS ARM64 runner; everyone else falls back to a
    # GitHub-hosted macOS box (macos-15).
    uses: ./.github/workflows/build-macos-reusable.yml
    with:
      build-type: Release
      build-both: 'ON'
      runner-type: ${{ github.actor == 'Randalphwa' && 'self-hosted' || 'github-hosted' }}
